name: Build IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. 1.0.0"
        required: false
        default: "1.0.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_15.2.app 2>/dev/null || true
          xcodebuild -version

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build_ipa.sh
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          scripts/build_ipa.sh "$VERSION"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoYue-unsigned-ipa
          path: build/MoYue-*.ipa
          retention-days: 7

      - name: Create Release and upload IPA
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/MoYue-*.ipa
          generate_release_notes: true